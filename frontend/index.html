<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E8EDEF" />
    <script>
      // Apply the saved daylight/dusk theme before first paint.
      try {
        var t = localStorage.getItem("replot.theme");
        if (t === "dusk" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>Replot</title>
    <meta name="description" content="Write and run code in your browser, with a real Linux container behind every repl." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
