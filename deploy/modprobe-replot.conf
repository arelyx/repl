# Replot host hardening: kernel modules repl workloads never need, which have
# carried recent local privilege escalations (Copy Fail CVE-2026-31431,
# Dirty Frag CVE-2026-43284 / CVE-2026-43500, Fragnesia). Patched kernels fix
# them; this removes the attack surface regardless.
install algif_aead /bin/false
install esp4 /bin/false
install esp6 /bin/false
install rxrpc /bin/false
install af_rxrpc /bin/false
