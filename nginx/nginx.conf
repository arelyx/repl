worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 50m;
  server_tokens off;

  # Docker's embedded DNS: repl containers come and go, so resolve per request.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Abuse limits, per client address. The published port is bound to the
  # host's loopback, so every request arrives from the Docker bridge gateway
  # of rc-internal (from Docker's default pools: 172.16.0.0/12 or
  # 192.168.0.0/16) via the host's TLS proxy (Caddy), which sets
  # X-Forwarded-For. Believe it only from there: repl containers sit on
  # 10.213.0.0/16 bridges and can't forge a client address.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone  $binary_remote_addr zone=api:10m  rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=wsconn:10m;
  limit_req_status  429;
  limit_conn_status 429;

  # Parsed from the *original* request URI so the auth subrequest sees them.
  map $request_uri $auth_repl_id  { ~^/ws/repls/(?<x>[a-z0-9]+)/ $x; default ""; }

  # Requests made by pages on a preview origin. Previews are the same *site*
  # as the app (SameSite=Lax cookies are sent), so user JavaScript there must
  # not be allowed to drive the API, websockets, or collaboration as the viewer.
  map $http_origin $from_preview { default 0; "~\.preview\." 1; }
  map $request_uri $auth_repl_svc { ~^/ws/repls/[a-z0-9]+/(?<y>run|shell|vnc|lsp) $y; default ""; }

  # Preview ports: a canonical decimal 1..65535 (no leading zeros, so "08008"
  # can't sneak past the denylist), and never the agent (8008), noVNC (6080)
  # or VNC (5900). Exact matches win over the regex.
  map $rport $preview_port_ok {
    default 0;
    "~^(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$" 1;
    8008 0;
    6080 0;
    5900 0;
  }

  # ── Web previews: {replId}-{port}.preview.<host> → repl-{replId}:{port} ──
  # Different origin from the app, so user code never sees the auth cookie.
  server {
    listen 80;
    server_name ~^(?<rid>[a-z0-9]+)-(?<rport>[0-9]+)\.preview\.;

    if ($preview_port_ok = 0) { return 404; }

    location / {
      proxy_pass http://repl-$rid:$rport;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Nothing a visitor sends may look like it came from the gateway, and
      # the visitor's cookies for the app's site stay out of user code.
      proxy_set_header X-Agent-Token "";
      proxy_set_header X-Repl-Role "";
      proxy_set_header Cookie "";
      proxy_read_timeout 1h;
      proxy_buffering off;
      proxy_intercept_errors on;
      error_page 502 503 504 = @down;
    }

    location @down {
      default_type text/html;
      return 502 '<html><body style="font-family:system-ui;background:#0e1525;color:#c2c8cc;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><h2>Nothing is listening on port $rport</h2><p>Start a web server bound to 0.0.0.0:$rport in your repl, then reload.</p></div></body></html>';
    }
  }

  # ── Main app ──
  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # add_header is only inherited by locations that have none of their own,
    # so /assets/ repeats these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    if ($from_preview) { return 403; }

    # The ws auth subrequest parses the raw request URI while proxy_pass uses
    # the normalised one; refuse anything where the two could differ
    # (e.g. /ws/repls/A/run/../../B/shell).
    if ($request_uri ~* "^/ws/.*(\.\.|%2e|%2f|%5c|//)") { return 400; }

    set $backend http://backend:8000;
    set $collab  http://collaboration:1234;

    location = /health { access_log off; return 200 "ok\n"; }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Credential guessing and sign-up floods.
    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Session checks happen on every page load; they get the general API limit.
    location = /api/v1/auth/me {
      limit_req zone=api burst=40 nodelay;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/internal/ { return 404; }

    # Caddy's on-demand TLS check for preview hostnames. Only the host may
    # ask: real_ip leaves the Docker gateway as $remote_addr for requests
    # without X-Forwarded-For, and Caddy sets that header on everything it
    # proxies from the internet.
    location = /tls-ask {
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 127.0.0.1;
      deny all;
      proxy_pass $backend/api/v1/internal/tls-ask$is_args$args;
    }

    location /collab {
      proxy_pass $collab;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    # nginx asks the backend whether the cookie's user may use this repl
    # service. The answer carries the caller's role and the repl's agent token.
    location = /_auth_repl {
      internal;
      proxy_pass $backend/api/v1/internal/auth-repl;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Repl-Id $auth_repl_id;
      proxy_set_header X-Repl-Service $auth_repl_svc;
    }

    # Every /ws/repls location below forwards only what the auth subrequest
    # decided (role + agent token) and drops the browser's cookies, which the
    # agent has no use for and user code could otherwise read.

    # Console / shell PTYs → in-container agent
    location ~ ^/ws/repls/(?<rid>[a-z0-9]+)/(?<svc>run|shell)$ {
      limit_conn wsconn 50;
      auth_request /_auth_repl;
      auth_request_set $repl_role $upstream_http_x_repl_role;
      auth_request_set $agent_token $upstream_http_x_agent_token;
      proxy_set_header X-Repl-Role $repl_role;
      proxy_set_header X-Agent-Token $agent_token;
      proxy_set_header Cookie "";
      proxy_pass http://repl-$rid:8008/$svc;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # Language servers (editor intellisense) → in-container agent
    location ~ ^/ws/repls/(?<rid>[a-z0-9]+)/lsp/(?<srv>[a-z0-9_-]+)$ {
      limit_conn wsconn 50;
      auth_request /_auth_repl;
      auth_request_set $repl_role $upstream_http_x_repl_role;
      auth_request_set $agent_token $upstream_http_x_agent_token;
      proxy_set_header X-Repl-Role $repl_role;
      proxy_set_header X-Agent-Token $agent_token;
      proxy_set_header Cookie "";
      proxy_pass http://repl-$rid:8008/lsp/$srv;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # noVNC static files + websockify. They listen on the container's
    # loopback only; the agent checks the token and proxies /vnc/* to them.
    location ~ ^/ws/repls/(?<rid>[a-z0-9]+)/vnc/(?<rest>.*)$ {
      limit_conn wsconn 50;
      auth_request /_auth_repl;
      auth_request_set $repl_role $upstream_http_x_repl_role;
      auth_request_set $agent_token $upstream_http_x_agent_token;
      proxy_set_header X-Repl-Role $repl_role;
      proxy_set_header X-Agent-Token $agent_token;
      proxy_set_header Cookie "";
      proxy_pass http://repl-$rid:8008/vnc/$rest$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
